services:
  # ── WordPress PHP-FPM ───────────────────────────────────────────────────────
  php:
    build:
      context:    .
      dockerfile: docker/Dockerfile.php
      target:     development
    volumes:
      - wordpress:/var/www/html
      - ./packages/core-plugin:/var/www/html/wp-content/plugins/blocky-core:ro
      - ./packages/builder-plugin:/var/www/html/wp-content/plugins/blocky-builder:ro
      - ./packages/theme:/var/www/html/wp-content/themes/blocky:ro
      - ./tools/wp-env/dev-helpers.php:/var/www/html/wp-content/mu-plugins/dev-helpers.php:ro
    environment:
      WORDPRESS_DB_HOST:     db
      WORDPRESS_DB_USER:     blocky
      WORDPRESS_DB_PASSWORD: blocky
      WORDPRESS_DB_NAME:     blocky
      WORDPRESS_DEBUG:       "1"
      BLOCKY_DEV:            "true"
      BLOCKY_ASSET_URL:      "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy
    networks: [blocky]

  # ── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - wordpress:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
    networks: [blocky]

  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE:      blocky
      MYSQL_USER:          blocky
      MYSQL_PASSWORD:      blocky
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks: [blocky]

  # ── Vite dev server (theme) ────────────────────────────────────────────────
  vite-theme:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm --filter @blocky/theme dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks: [blocky]
    profiles: [dev]

  # ── Vite dev server (builder) ──────────────────────────────────────────────
  vite-builder:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm --filter @blocky/builder-plugin dev"
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
    networks: [blocky]
    profiles: [dev]

volumes:
  wordpress:
  dbdata:

networks:
  blocky:
    driver: bridge
