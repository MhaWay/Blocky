name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION:    "22"
  PHP_VERSION:     "8.2"
  PNPM_VERSION:    "9"

jobs:
  # ── JS: typecheck + lint + build ──────────────────────────────────────────────
  js:
    name: JS (typecheck / lint / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @blocky/tokens build
        name: Build tokens

      - run: pnpm typecheck
        name: Typecheck

      - run: pnpm lint
        name: Lint (ESLint + Stylelint)

      - run: pnpm build
        name: Build all packages

      - uses: actions/upload-artifact@v4
        with:
          name: js-dist
          path: |
            packages/tokens/build
            packages/theme/dist
            packages/builder-plugin/dist

  # ── PHP: phpcs + phpstan + phpunit ─────────────────────────────────────────
  php:
    name: PHP ${{ matrix.php }} (phpcs / phpstan / tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions:  mbstring, intl, gd, zip
          tools:       composer:v2
          coverage:    xdebug

      - uses: actions/cache@v4
        with:
          path:         packages/core-plugin/vendor
          key:          composer-${{ matrix.php }}-${{ hashFiles('packages/core-plugin/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - run:  composer install --no-interaction --prefer-dist
        name: Composer install
        working-directory: packages/core-plugin

      - run:  composer phpcs
        name: PHPCS
        working-directory: packages/core-plugin

      - run:  composer phpstan
        name: PHPStan
        working-directory: packages/core-plugin
        continue-on-error: true  # PHPStan may need WordPress stubs — non-fatal in CI for now

      - run:  composer test -- --coverage-text --log-junit junit.xml
        name: PHPUnit
        working-directory: packages/core-plugin

      - uses: actions/upload-artifact@v4
        if:   always()
        with:
          name: php-junit-${{ matrix.php }}
          path: packages/core-plugin/junit.xml

  # ── E2E: Playwright ───────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs:   [js]
    if:      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium
        name: Install Playwright browsers

      - name: Start wp-env
        run:  pnpm wp-env start
        timeout-minutes: 10

      - name: Download JS dist
        uses: actions/download-artifact@v4
        with: { name: js-dist }

      - run: pnpm exec playwright test
        name: Run Playwright tests

      - uses: actions/upload-artifact@v4
        if:   always()
        with:
          name: playwright-report
          path: playwright-report/
