pre-commit:
  parallel: false
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
    lint-staged-js:
      glob: "*.{ts,tsx,js}"
      run: pnpm eslint {staged_files} --max-warnings=0 --no-warn-ignored
    lint-staged-css:
      glob: "*.css"
      run: sh -c 'f=; for x in "{staged_files}"; do case "\$x" in packages/core-plugin/resources/css/*) ;; *) f="\$f \$x";; esac; done; [ -n "\$f" ] && pnpm stylelint \$f || true'
    format-check:
      glob: "*.{ts,tsx,js,json,css}"
      run: pnpm prettier --check {staged_files}

pre-push:
  commands:
    test:
      run: pnpm test
