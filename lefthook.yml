pre-commit:
  parallel: false
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
    lint-staged-js:
      glob: "*.{ts,tsx,js}"
      run: pnpm eslint {staged_files} --max-warnings=0
    lint-staged-css:
      glob: "*.css"
      run: pnpm stylelint {staged_files}
    format-check:
      glob: "*.{ts,tsx,js,json,css}"
      run: pnpm prettier --check {staged_files}

pre-push:
  commands:
    test:
      run: pnpm test
